plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.typing.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.typing.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'typingapp123'
            keyAlias 'typingapp'
            keyPassword 'typingapp123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

// Auto-generate debug keystore if it doesn't exist
tasks.register('generateKeystore') {
    def keystoreFile = file("${projectDir}/release.keystore")
    if (!keystoreFile.exists()) {
        exec {
            commandLine 'keytool', '-genkeypair',
                '-v', '-keystore', keystoreFile.absolutePath,
                '-storepass', 'typingapp123',
                '-alias', 'typingapp',
                '-keypass', 'typingapp123',
                '-keyalg', 'RSA',
                '-validity', '10000',
                '-dname', 'CN=Typing App Debug, OU=Dev, O=TypingApp, L=City, ST=State, C=US',
                '-storetype', 'JKS'
        }
    }
}

preBuild.dependsOn generateKeystore
