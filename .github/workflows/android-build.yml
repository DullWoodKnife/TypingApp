name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto increment version
        run: |
          # Read current versionCode and versionName
          CURRENT_CODE=$(grep -oP 'versionCode \K\d+' app/build.gradle)
          CURRENT_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          
          # Increment versionCode
          NEW_CODE=$((CURRENT_CODE + 1))
          
          # Increment last digit of versionName (e.g., 1.0 -> 1.1)
          IFS='.' read -ra PARTS <<< "$CURRENT_NAME"
          LAST_PART=${PARTS[-1]}
          NEW_LAST_PART=$((LAST_PART + 1))
          PARTS[-1]=$NEW_LAST_PART
          NEW_NAME=$(IFS='.'; echo "${PARTS[*]}")
          
          # Update build.gradle
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" app/build.gradle
          sed -i "s/versionName \"$CURRENT_NAME\"/versionName \"$NEW_NAME\"/" app/build.gradle
          
          echo "Version bumped: $CURRENT_NAME ($CURRENT_CODE) -> $NEW_NAME ($NEW_CODE)"
          
          # Configure git and commit
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add app/build.gradle
          git commit -m "Auto version bump to $NEW_NAME ($NEW_CODE) [skip ci]"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Signed Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-signed
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
