name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storepass typingapp123 \
            -alias typingapp \
            -keypass typingapp123 \
            -keyalg RSA \
            -validity 10000 \
            -dname "CN=Typing App Debug, OU=Dev, O=TypingApp, L=City, ST=State, C=US" \
            -storetype JKS

      - name: Build Signed Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-signed
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
